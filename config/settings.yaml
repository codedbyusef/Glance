# Server + client wiring. Fill in once the Vultr instance and camera source are decided.
server:
  url: "ws://localhost:8000/ws"   # tunnel to Vultr: ssh -L 8000:localhost:8000 ...
  frame_width: 640
  frame_height: 480
  jpeg_quality: 70

camera:
  source: 0  # webcam index, or a phone-stream URL

detector:
  model_id: "yolov8m-worldv2.pt"  # swap for yolov8s-worldv2.pt (faster) or yolov8l-worldv2.pt (more accurate) after benchmarking
  confidence_threshold: 0.1

# Reach session thresholds (detection/CLAUDE.md "Object detection and tracking (settled)" -> End statuses).
# Starting values -- tune, not measured.
reach_session:
  resume_reacquire_after_s: 3.0
  target_not_found_after_s: 3.0
  target_lost_after_s: 2.0
  hand_lost_after_s: 1.5
  stalled_after_s: 7.0
  timeout_s: 28.0
  success_hold_frames: 7          # 5-10 frame band
  inferred_overlap_frames: 5
  stale_link_after_s: 0.5

wake_word:
  phrase: "hey jarvis"
  vad_enabled: true
  push_to_talk_fallback: true

haptics:
  transport: "ble"  # "ble" or "wifi" -- undecided
  rate_hz: 20

latency:
  target_ms: 200  # starting proposal, not a measured fact (CLAUDE.md "Latency")
