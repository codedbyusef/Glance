# Settings for depth-estimation/. Starting values -- tune, not measured.
# Every threshold has two versions: "metric" (meters, metric model) and
# "relative" (fraction of the frame's depth range, relative model).

# Frames are processed the way the perception server will receive them
# (same as hand-detection/config.yaml).
frame:
  frame_width: 640
  frame_height: 480
  jpeg_quality: 70

camera:
  source: 0   # webcam index, or a video/stream URL

model:
  kind: relative            # relative | metric -- pick after the tape-measure test (README step 3)
  ids:
    relative: depth-anything/Depth-Anything-V2-Small-hf
    metric: depth-anything/Depth-Anything-V2-Metric-Indoor-Small-hf
  input_size: 364           # longest side fed to the model; rounded to a multiple of 14
  device: auto              # auto (cuda, then mps, then cpu) | cuda | mps | cpu
  fp16: true                # CUDA only; set false if depth looks wrong
  every_n_frames: 1         # 1 = depth every frame, 2 = every other frame (reuse the last map)

# Relative model only: per-frame normalization (larger output = closer is flipped
# so every value in this folder means "larger = farther").
normalize:
  low_pct: 5
  high_pct: 95

sampling:
  erode_px: 3               # shrink masks before taking the median; depth blurs at edges
  box_shrink: 0.2           # target box shrunk by this fraction when no mask is given
  min_pixels: 30            # fewer usable pixels than this -> sample invalid
  hand_region_scale: 2.0    # band box scaled by this to approximate the whole hand (fingers)

smoothing:
  median_window: 5
  ema_alpha: 0.4            # weight on the newest median
  max_rejects: 3            # after this many rejected jumps in a row, accept and re-seed

occlusion:
  freeze_overlap: 0.30      # hand region covers this fraction of the target -> freeze target depth
  unfreeze_overlap: 0.15    # overlap must drop below this to unfreeze
  min_visible: 0.5          # visible target pixels / pixels at last good sample; below -> freeze
  moved_frac: 0.25          # target center moved this fraction of its box diagonal -> unfreeze

thresholds:
  metric:
    jump: 0.15              # m; a sample this far from the smoothed value is dropped
    contact: 0.04           # m; |gap| under this counts toward touching
    near: 0.15              # m; |gap| under this = "near"
    far: 0.40               # m; |gap| over this = "far" (between = "mid")
    area_cross_check: 0.05  # m; hand distance change that must agree with band area change
  relative:
    jump: 0.25
    contact: 0.05
    near: 0.15
    far: 0.35
    area_cross_check: 0.08

touching:
  hold_frames: 7            # consecutive frames (5-10 band, same as the reach session)

# Knuckle-to-contact offset: dz at real contact, because the band sits on the
# knuckles, not the fingertips. Measure with test_depth_live.py key "c".
contact_offset:
  active_object: paper      # paper | can (or add your own)
  metric:
    paper: 0.0
    can: 0.0
  relative:
    paper: 0.0
    can: 0.0

# Band size checks.
band:
  area_ratio: 1.25          # band area grew/shrank by this factor over the window -> check depth agrees
  window: 5
  width_m: 0.025            # physical tape width
  focal_px: null            # camera focal length in pixels; calibrate with key "f"

# depth_error for haptics/controller.py (wall mode). Positive = target farther than hand.
# Metric: gap in meters is passed as-is (the controller's 0.04/0.06/0.35 read as 4/6/35 cm).
# Relative: gap is multiplied by this scale. Tune so a ~30 cm miss gives roughly 0.35.
controller:
  relative_scale: 1.0
